name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Claude quota reconciliation
        env:
          CGO_ENABLED: "0"
        run: go test -tags purego -count=1 -run '(ClaudeQuota|ManagementQuotaReconcile)' ./sdk/cliproxy/auth ./internal/api
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
